name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install zensical unidecode ghp-import

      - name: Install slugify_vi module
        run: python -c "import site, shutil; shutil.copy('slugify_vi.py', site.getsitepackages()[0] + '/slugify_vi.py')"

      - name: Build site
        run: zensical build

      - name: Deploy to gh-pages
        run: ghp-import -n -p -f site
